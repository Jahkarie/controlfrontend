<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONTROL — Deep Space Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-space: #030308;
      --card-bg: rgba(10, 12, 24, 0.85);
      --border-cyan: rgba(0, 243, 255, 0.3);
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff007f;
      --neon-purple: #9d00ff;
      --text-bright: #ffffff;
      --text-dim: #9aa0ba;
      --input-bg: #090b14;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rajdhani', -apple-system, sans-serif;
      background-color: var(--bg-space);
      color: var(--text-bright);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(157, 0, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 243, 255, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 20% 90%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
    }

    /* Ambient Space Dust Particle Simulation */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                  radial-gradient(1px 1px at 40px 70px, rgba(0,243,255,0.8), rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 90px 40px, rgba(255,0,127,0.8), rgba(0,0,0,0)),
                  radial-gradient(1.5px 1.5px at 160px 120px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 250px 250px;
      opacity: 0.35;
      z-index: -1;
    }

    .space-card {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-cyan);
      border-radius: 16px;
      padding: 38px 30px;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.15), 0 20px 50px rgba(0,0,0,0.8);
      position: relative;
    }

    /* Sci-Fi Corner HUD Accents */
    .space-card::before, .space-card::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--neon-cyan);
      border-style: solid;
    }
    .space-card::before { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
    .space-card::after { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .sub-tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .title-control {
      font-family: 'Orbitron', sans-serif;
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(0, 243, 255, 0.6), 0 0 30px rgba(157, 0, 255, 0.4);
    }

    .sponsors-strip {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 10px;
      font-weight: 600;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--neon-cyan);
      margin-bottom: 10px;
      display: block;
    }

    .space-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 16px;
      color: var(--text-bright);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      outline: none;
      transition: all 0.25s ease;
      margin-bottom: 22px;
    }

    .space-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .btn-launch {
      width: 100%;
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-purple) 100%);
      color: #000000;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: none;
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    }

    .btn-launch:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.7);
    }

    .size-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .size-btn {
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-bright);
      padding: 14px 0;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .size-btn.selected {
      background: var(--neon-cyan);
      color: #000000;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 6px 16px;
      border-radius: 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .hud-box {
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 3px solid var(--neon-magenta);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 15px;
      color: var(--text-dim);
    }

    .hud-box strong {
      color: var(--text-bright);
      font-family: 'Orbitron', sans-serif;
    }

    .counter-tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      color: var(--neon-magenta);
      background: rgba(255, 0, 127, 0.12);
      border: 1px solid rgba(255, 0, 127, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      display: inline-block;
      margin-top: 14px;
      letter-spacing: 1px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="space-card">
    <div class="brand-header">
      <span class="sub-tag">CHATTABOX PRESENTS</span>
      <h1 class="title-control">CONTROL</h1>
      <div class="sponsors-strip">CARIB &bull; WESTERN UNION &bull; BREW</div>
    </div>

    <!-- VIEW 1: GATEWAY ACCESS -->
    <div id="view-gateway">
      <label class="form-label" for="email-entry">// TRANSMISSION ACCESS EMAIL</label>
      <input type="email" id="email-entry" class="space-input" placeholder="guest@galaxy.com" />
      <button class="btn-launch" onclick="checkGuestStatus()">AUTHENTICATE ACCESS</button>
    </div>

    <!-- VIEW 2: PACKAGE SIZE SELECTION -->
    <div id="view-select-size" class="hidden">
      <label class="form-label">// SELECT SUIT / TEE SIZE</label>
      <div class="size-grid">
        <button class="size-btn" onclick="selectSize(this, 'XS')">XS</button>
        <button class="size-btn" onclick="selectSize(this, 'S')">S</button>
        <button class="size-btn" onclick="selectSize(this, 'M')">M</button>
        <button class="size-btn" onclick="selectSize(this, 'L')">L</button>
        <button class="size-btn" onclick="selectSize(this, 'XL')">XL</button>
        <button class="size-btn" onclick="selectSize(this, 'XXL')">XXL</button>
      </div>
      <button class="btn-launch" onclick="confirmPackage()">LOCK PACKAGE TIER</button>
    </div>

    <!-- VIEW 3: APPROVED DASHBOARD & INVITES -->
    <div id="view-approved" class="hidden">
      <div style="text-align: center;">
        <span class="status-pill">&#10003; CLEARANCE APPROVED</span>
      </div>

      <div class="hud-box">
        LOCKED TIER: <strong id="confirmed-size">M</strong><br>
        <span style="font-size: 12px; opacity: 0.7;">Your kit allocation has been registered in the system.</span>
      </div>

      <label class="form-label">// INVITE CREW MEMBER</label>
      <input type="email" id="friend-email" class="space-input" placeholder="crew@galaxy.com" />

      <label class="form-label">// TRANSMISSION NOTE (OPTIONAL)</label>
      <textarea id="invite-note" class="space-input" style="height: 80px; resize: none;" placeholder="Enter message..."></textarea>

      <button class="btn-launch" onclick="sendFriendInvite()">DISPATCH INVITATION</button>
      
      <div style="text-align: center;">
        <span class="counter-tag"><span id="remaining-count">2</span> INVITATION CLEARANCES REMAINING</span>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://control-1-0baa.onrender.com";
    let currentGuestEmail = "";
    let selectedSize = "";

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const emailParam = urlParams.get('email');
      if (emailParam) {
        document.getElementById('email-entry').value = emailParam;
        checkGuestStatus();
      }
    });

    async function checkGuestStatus() {
      const email = document.getElementById('email-entry').value.trim();
      if (!email) return alert("Please enter your invited email address.");

      try {
        const res = await fetch(`${API_BASE}/api/guest-status?email=${encodeURIComponent(email)}`);
        const data = await res.json();

        if (!res.ok || !data.authorized) {
          return alert("This email address has not been cleared for access.");
        }

        currentGuestEmail = email;
        if (data.guest.status === 'APPROVED') {
          showApprovedView(data.guest.shirt_size, data.guest.invites_remaining);
        } else {
          document.getElementById('view-gateway').classList.add('hidden');
          document.getElementById('view-select-size').classList.remove('hidden');
        }
      } catch (err) {
        alert("Unable to reach CONTROL command server.");
      }
    }

    function selectSize(element, size) {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
    }

    async function confirmPackage() {
      if (!selectedSize) return alert("Please select a size tier.");

      try {
        const res = await fetch(`${API_BASE}/api/secure-package`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentGuestEmail, shirtSize: selectedSize })
        });
        const data = await res.json();
        if (data.success) {
          showApprovedView(data.guest.shirt_size, data.guest.invites_remaining);
        }
      } catch (err) {
        alert("Error locking your selection.");
      }
    }

    function showApprovedView(size, remaining) {
      document.getElementById('confirmed-size').innerText = size || 'M';
      document.getElementById('remaining-count').innerText = remaining;
      document.getElementById('view-gateway').classList.add('hidden');
      document.getElementById('view-select-size').classList.add('hidden');
      document.getElementById('view-approved').classList.remove('hidden');
    }

    async function sendFriendInvite() {
      const friendEmail = document.getElementById('friend-email').value.trim();
      const note = document.getElementById('invite-note').value.trim();

      if (!friendEmail) return alert("Please enter your crew member's email address.");

      try {
        const res = await fetch(`${API_BASE}/api/send-invite`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ inviterEmail: currentGuestEmail, friendEmail, note })
        });
        const data = await res.json();

        if (data.success) {
          alert(`Invitation dispatched to ${friendEmail}!`);
          document.getElementById('remaining-count').innerText = data.remaining;
          document.getElementById('friend-email').value = "";
          document.getElementById('invite-note').value = "";
        } else {
          alert(data.error || "Could not dispatch invitation.");
        }
      } catch (err) {
        alert("Failed to send invitation.");
      }
    }
  </script>
</body>
</html>
