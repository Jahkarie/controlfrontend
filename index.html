<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTRL — Powered by CASHCXDE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 80% 20%, #0a2e38 0%, #030407 60%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .card {
      background: rgba(11, 14, 23, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 28px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
      position: relative;
    }

    /* Sponsor Subheader */
    .sponsor-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #838a9e;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .sponsor-tag span {
      color: #ffffff;
    }

    /* Fixed Brand Header */
    .brand-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(28px, 8vw, 36px); /* Auto scales text to prevent overflow */
      font-weight: 900;
      letter-spacing: 6px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 24px;
      white-space: nowrap;
    }

    /* Status Pill */
    .status-pill {
      display: inline-block;
      padding: 10px 24px;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid #00f0ff;
      border-radius: 50px;
      color: #00f0ff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      margin-bottom: 30px;
    }

    /* Tier Allocation Box */
    .tier-box {
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid #00f0ff;
      border-radius: 14px;
      padding: 20px;
      text-align: left;
      margin-bottom: 32px;
    }

    .tier-box h3 {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .tier-box p {
      font-size: 13px;
      color: #6c758d;
    }

    /* Form Elements */
    .section-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #00f0ff;
      text-transform: uppercase;
      text-align: left;
      margin-bottom: 10px;
      display: block;
    }

    .input-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 14px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
      margin-bottom: 16px;
    }

    .input-field:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
    }

    .input-field::placeholder {
      color: #4a5163;
    }

    .btn-submit {
      width: 100%;
      background: #ffffff;
      color: #000000;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }

    .btn-submit:hover:not(:disabled) {
      background: #00f0ff;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 240, 255, 0.2);
    }

    .btn-submit:disabled {
      background: rgba(255, 255, 255, 0.2);
      color: #6c758d;
      cursor: not-allowed;
      transform: none;
    }

    /* Badge Counter */
    .counter-badge {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(112, 0, 255, 0.2);
      border: 1px solid rgba(112, 0, 255, 0.4);
      border-radius: 20px;
      color: #a855f7;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="sponsor-tag">PRESENTED BY <span>CASHCXDE</span></div>
    <div class="brand-title">CONTROL</div>

    <div class="status-pill">ACCESS GRANTED</div>

    <div class="tier-box">
      <h3 id="tier-display">Tier XS</h3>
      <p id="tier-status">Your allocation is securely locked.</p>
    </div>

    <label class="section-label">DISPATCH GUEST INVITATION</label>
    <input type="email" id="friend-email" class="input-field" placeholder="friend@domain.com" />

    <button type="button" id="send-btn" class="btn-submit">SEND INVITATION</button>

    <div class="counter-badge" id="invites-badge">0 INVITES REMAINING</div>
  </div>

  <script>
    // State
    let invitesRemaining = 0; // Replace with value fetched from backend API

    const sendBtn = document.getElementById('send-btn');
    const invitesBadge = document.getElementById('invites-badge');
    const emailInput = document.getElementById('friend-email');

    function updateState() {
      invitesBadge.textContent = `${invitesRemaining} INVITES REMAINING`;
      
      if (invitesRemaining <= 0) {
        sendBtn.disabled = true;
        emailInput.disabled = true;
      } else {
        sendBtn.disabled = false;
        emailInput.disabled = false;
      }
    }

    sendBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) return alert('Please enter a valid email address.');

      sendBtn.disabled = true;
      sendBtn.textContent = 'SENDING...';

      try {
        // Backend API request example
        const res = await fetch('/api/send-invite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ friendEmail: email })
        });

        const data = await res.json();
        if (data.success) {
          invitesRemaining = data.remaining;
          emailInput.value = '';
          alert('Invitation dispatched successfully.');
        } else {
          alert(data.error || 'Failed to send invite.');
        }
      } catch (err) {
        alert('Server communication error.');
      } finally {
        sendBtn.textContent = 'SEND INVITATION';
        updateState();
      }
    });

    // Initialize UI
    updateState();
  </script>
</body>
</html>
