<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONTROL — Presented by CASHCXDE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #030407;
      --card-glass: rgba(13, 16, 27, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --neon-cyan: #00f0ff;
      --neon-glow: rgba(0, 240, 255, 0.25);
      --cashcxde-accent: #7000ff;
      --text-main: #f3f4f8;
      --text-muted: #838a9e;
      --input-bg: rgba(6, 8, 15, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Cosmic Background Nebulae */
    body::before {
      content: "";
      position: fixed;
      width: 600px;
      height: 600px;
      top: -100px;
      left: -100px;
      background: radial-gradient(circle, rgba(112, 0, 255, 0.2) 0%, rgba(0,0,0,0) 70%);
      z-index: -2;
      filter: blur(80px);
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      bottom: -100px;
      right: -100px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
      z-index: -2;
      filter: blur(80px);
      pointer-events: none;
    }

    /* Smooth View Animations */
    .view-panel {
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .main-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
    }

    /* CASHCXDE Header Branding */
    .sponsor-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .sponsor-badge span {
      color: var(--neon-cyan);
      background: linear-gradient(90deg, var(--neon-cyan), var(--cashcxde-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }

    .title-control {
      font-family: 'Syne', sans-serif;
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
      text-align: center;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      margin-bottom: 32px;
    }

    .form-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: block;
    }

    .custom-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 15px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
      margin-bottom: 20px;
    }

    .custom-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px var(--neon-glow);
    }

    .btn-action {
      width: 100%;
      background: linear-gradient(135deg, var(--neon-cyan) 0%, #0088ff 100%);
      color: #000000;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: none;
      border-radius: 14px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 25px rgba(0, 240, 255, 0.25);
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0, 240, 255, 0.4);
    }

    .size-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .size-card {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 16px 0;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .size-card:hover {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .size-card.selected {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--neon-cyan);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }

    .info-card {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .info-card strong {
      color: var(--text-main);
      font-weight: 700;
    }

    .invite-pill {
      font-size: 11px;
      font-weight: 700;
      color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.2);
      padding: 8px 16px;
      border-radius: 30px;
      display: inline-block;
      margin-top: 16px;
      letter-spacing: 1px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="sponsor-badge">PRESENTED BY <span>CASHCXDE</span></div>
    <h1 class="title-control">CONTROL</h1>

    <!-- VIEW 1: GATEWAY VERIFICATION -->
    <div id="view-gateway" class="view-panel">
      <label class="form-label" for="email-entry">Invited Email Address</label>
      <input type="email" id="email-entry" class="custom-input" placeholder="yourname@domain.com" />
      <button class="btn-action" onclick="checkGuestStatus()">Verify Invitation</button>
    </div>

    <!-- VIEW 2: SELECT SHIRT / PACKAGE SIZE -->
    <div id="view-select-size" class="view-panel hidden">
      <label class="form-label">Select Package Size</label>
      <div class="size-grid">
        <button class="size-card" onclick="selectSize(this, 'XS')">XS</button>
        <button class="size-card" onclick="selectSize(this, 'S')">S</button>
        <button class="size-card" onclick="selectSize(this, 'M')">M</button>
        <button class="size-card" onclick="selectSize(this, 'L')">L</button>
        <button class="size-card" onclick="selectSize(this, 'XL')">XL</button>
        <button class="size-card" onclick="selectSize(this, 'XXL')">XXL</button>
      </div>
      <button class="btn-action" onclick="confirmPackage()">Confirm & Lock Selection</button>
    </div>

    <!-- VIEW 3: ACCESS DASHBOARD & DISPATCH INVITES -->
    <div id="view-approved" class="view-panel hidden">
      <div style="text-align: center;">
        <span class="status-badge">&#10003; Access Granted</span>
      </div>

      <div class="info-card">
        Selected Size: <strong id="confirmed-size">M</strong><br>
        <span style="font-size: 12px; opacity: 0.7;">Package tier locked to guest profile.</span>
      </div>

      <label class="form-label">Dispatch Guest Invitation</label>
      <input type="email" id="friend-email" class="custom-input" placeholder="friend@domain.com" />

      <label class="form-label">Personal Message (Optional)</label>
      <textarea id="invite-note" class="custom-input" style="height: 80px; resize: none;" placeholder="Add a note..."></textarea>

      <button class="btn-action" onclick="sendFriendInvite()">Send Invitation</button>
      
      <div style="text-align: center;">
        <span class="invite-pill"><span id="remaining-count">2</span> Invites Remaining</span>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://control-1-0baa.onrender.com";
    let currentGuestEmail = "";
    let selectedSize = "";

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const emailParam = urlParams.get('email');
      if (emailParam) {
        document.getElementById('email-entry').value = emailParam;
        checkGuestStatus();
      }
    });

    async function checkGuestStatus() {
      const email = document.getElementById('email-entry').value.trim();
      if (!email) return alert("Please enter your email address.");

      try {
        const res = await fetch(`${API_BASE}/api/guest-status?email=${encodeURIComponent(email)}`);
        const data = await res.json();

        if (!res.ok || !data.authorized) {
          return alert("This email has not been invited yet.");
        }

        currentGuestEmail = email;
        if (data.guest.status === 'APPROVED') {
          showApprovedView(data.guest.shirt_size, data.guest.invites_remaining);
        } else {
          document.getElementById('view-gateway').classList.add('hidden');
          document.getElementById('view-select-size').classList.remove('hidden');
        }
      } catch (err) {
        alert("Failed to connect to CONTROL server.");
      }
    }

    function selectSize(element, size) {
      selectedSize = size;
      document.querySelectorAll('.size-card').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
    }

    async function confirmPackage() {
      if (!selectedSize) return alert("Please select a size.");

      try {
        const res = await fetch(`${API_BASE}/api/secure-package`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentGuestEmail, shirtSize: selectedSize })
        });
        const data = await res.json();
        if (data.success) {
          showApprovedView(data.guest.shirt_size, data.guest.invites_remaining);
        }
      } catch (err) {
        alert("Error saving your selection.");
      }
    }

    function showApprovedView(size, remaining) {
      document.getElementById('confirmed-size').innerText = size || 'M';
      document.getElementById('remaining-count').innerText = remaining;
      document.getElementById('view-gateway').classList.add('hidden');
      document.getElementById('view-select-size').classList.add('hidden');
      document.getElementById('view-approved').classList.remove('hidden');
    }

    async function sendFriendInvite() {
      const friendEmail = document.getElementById('friend-email').value.trim();
      const note = document.getElementById('invite-note').value.trim();

      if (!friendEmail) return alert("Please enter your friend's email address.");

      try {
        const res = await fetch(`${API_BASE}/api/send-invite`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ inviterEmail: currentGuestEmail, friendEmail, note })
        });
        const data = await res.json();

        if (data.success) {
          alert(`Invitation sent to ${friendEmail}!`);
          document.getElementById('remaining-count').innerText = data.remaining;
          document.getElementById('friend-email').value = "";
          document.getElementById('invite-note').value = "";
        } else {
          alert(data.error || "Could not send invitation.");
        }
      } catch (err) {
        alert("Failed to send invitation.");
      }
    }
  </script>
</body>
</html>
